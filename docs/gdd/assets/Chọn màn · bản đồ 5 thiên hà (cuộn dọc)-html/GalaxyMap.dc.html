<style>
body{margin:0}
@keyframes tw{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes pulse{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.8);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.tw{animation:tw 3s ease-in-out infinite}
.pulse{animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
.spin{animation:spin 240s linear infinite;transform-box:fill-box;transform-origin:center}
.spin2{animation:spin 400s linear infinite reverse;transform-box:fill-box;transform-origin:center}
button{font:inherit}
@keyframes inFade{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
.in{animation:inFade 1.4s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center}
@keyframes driftA{from{transform:translate(-14px,4px)}to{transform:translate(14px,-4px)}}
.driftA{animation:driftA 12s ease-in-out infinite alternate}
.driftB{animation:driftA 16s ease-in-out infinite alternate-reverse}
@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.draw{stroke-dasharray:100;animation:draw 2.4s ease-out .3s both}
@keyframes orbit{to{stroke-dashoffset:-100}}
.orbit{stroke-dasharray:7 93;animation:orbit 6s linear infinite}
.orbit2{stroke-dasharray:3 97;animation:orbit 6s linear -3s infinite}
@keyframes breath{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}
.breath{animation:breath 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.18)}100%{opacity:1;transform:scale(1)}}
.pop{animation:pop .7s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center}
.spinS{animation:spin 40s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes webp{0%,100%{opacity:.55}50%{opacity:1}}
.webp{animation:webp 5s ease-in-out infinite}
@keyframes meteor{0%{transform:translate(0,0);opacity:0}3%{opacity:1}13%{transform:translate(240px,160px);opacity:0}100%{transform:translate(240px,160px);opacity:0}}
.meteor{animation:meteor 8s ease-in infinite}
@keyframes beamIn{from{transform:scale(0)}to{transform:scale(1)}}
.beamIn{animation:beamIn .9s ease-out both;transform-box:fill-box;transform-origin:0% 100%}
@keyframes fanIn{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
.fanIn{animation:fanIn 1.3s cubic-bezier(.2,.8,.2,1) .8s both;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fanLoop{0%,100%{opacity:.7}50%{opacity:1}}
.fanLoop{animation:fanLoop 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(-5px) rotate(-5deg)}50%{transform:translateY(5px) rotate(5deg)}}
.float{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.portalA{animation:spin 12s linear infinite;transform-box:fill-box;transform-origin:center}
.portalB{animation:spin 18s linear infinite reverse;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
