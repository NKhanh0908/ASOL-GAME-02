<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">Mirror · Mockup Giao Diện &amp; Hệ Thống Lưới HSR</title>
  <desc id="desc">Màn hình điện thoại dọc chuẩn phong cách Tấm Bia Tiên Tri HSR với hệ lưới toạ độ vàng ấm, vòng tròn chiêm tinh, mẫu mục tiêu và khay mảnh.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="100%" stop-color="#0A1329"/>
    </linearGradient>

    <!-- Amber Glow Gradient -->
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="60%" stop-color="#FFC857"/>
      <stop offset="100%" stop-color="#E59B28"/>
    </linearGradient>

    <!-- Board Glass Gradient -->
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1A33" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#091224" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="hsrGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#FFC857" stroke-width="0.75" stroke-opacity="0.16"/>
      <circle cx="0" cy="0" r="1.2" fill="#FFC857" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Deep Cosmic Canvas -->
  <rect width="1000" height="720" rx="20" fill="url(#mainBg)"/>

  <!-- Starry Background Accents -->
  <g fill="#A6CEFF" opacity="0.25">
    <circle cx="50" cy="80" r="1.2"/><circle cx="200" cy="40" r="1"/><circle cx="380" cy="110" r="1.5"/>
    <circle cx="750" cy="60" r="1"/><circle cx="920" cy="100" r="1.2"/><circle cx="880" cy="450" r="1"/>
  </g>

  <!-- Title -->
  <text x="50" y="46" fill="#EEF4FA" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="1">MIRROR · THIẾT KẾ GIAO DIỆN &amp; HỆ LƯỚI CHIÊM TINH (HSR STYLE)</text>

  <!-- PHONE CHASSIS (MÀN HÌNH DỌC ANDROID) -->
  <g transform="translate(50, 70)">
    <!-- Outer Phone Border -->
    <rect width="360" height="610" rx="28" fill="#040710" stroke="#364E6E" stroke-width="2.5"/>
    <!-- Screen Glass -->
    <rect x="10" y="10" width="340" height="590" rx="20" fill="#070D1E"/>

    <!-- HEADER: Tên game & Màn chơi -->
    <text x="24" y="42" fill="#EEF4FA" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" letter-spacing="2">MIRROR</text>
    <text x="24" y="62" fill="#FFC857" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">2-1 · Mũi Tên Chỉ Thiên</text>
    <text x="24" y="78" fill="#7E9BB8" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5">Ghép các mảnh vàng vào bóng mục tiêu</text>

    <!-- THUMBNAIL MẪU (KHUNG MỤC TIÊU CÓ LƯỚI HSR) -->
    <g transform="translate(230, 24)">
      <!-- Thumbnail Outer Glass -->
      <rect width="86" height="62" rx="10" fill="url(#boardGrad)" stroke="#68B8DC" stroke-width="1.2"/>
      <!-- Subtle Grid Inside Target -->
      <rect width="86" height="62" rx="10" fill="url(#hsrGrid)" opacity="0.8"/>
      <!-- Label -->
      <text x="43" y="15" text-anchor="middle" fill="#68B8DC" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1">MỤC TIÊU</text>
      <!-- Target Silhouette: Vanguard Arrow (Mũi tên với rãnh khuyết rỗng) -->
      <g transform="translate(43, 38)" filter="url(#amberGlow)">
        <path d="M 0,-18 L 16,6 L -16,6 Z M -14,0 H 14 V 18 H -14 Z" fill="url(#amberGold)" fill-rule="evenodd" stroke="#FFF3C4" stroke-width="0.8"/>
      </g>
    </g>

    <!-- BÀN CHƠI CHÍNH (HSR CELESTIAL BOARD WITH AMBER GRID) -->
    <g transform="translate(16, 94)">
      <!-- Board Container -->
      <rect width="308" height="370" rx="16" fill="url(#boardGrad)" stroke="#1F3A5F" stroke-width="1.5"/>

      <!-- HSR Celestial Magic Dial (Vòng tròn ma trận thiên văn) -->
      <circle cx="154" cy="185" r="142" fill="none" stroke="#68B8DC" stroke-width="0.8" stroke-opacity="0.35"/>
      <circle cx="154" cy="185" r="134" fill="none" stroke="#FFC857" stroke-width="0.75" stroke-opacity="0.25" stroke-dasharray="4 4"/>
      <circle cx="154" cy="185" r="124" fill="none" stroke="#2D4D77" stroke-width="0.6"/>

      <!-- Runic Dots on Ring -->
      <circle cx="154" cy="43" r="2.5" fill="#68B8DC" opacity="0.7"/>
      <circle cx="154" cy="327" r="2.5" fill="#68B8DC" opacity="0.7"/>
      <circle cx="12" cy="185" r="2.5" fill="#68B8DC" opacity="0.7"/>
      <circle cx="296" cy="185" r="2.5" fill="#68B8DC" opacity="0.7"/>

      <!-- HSR AMBER COORDINATE GRID LINES & INTERSECTION DOTS -->
      <rect x="14" y="14" width="280" height="342" fill="url(#hsrGrid)"/>

      <!-- GHOST / TARGET SILHOUETTE ON BOARD (BÓNG MỜ MỤC TIÊU TRÊN BÀN) -->
      <g transform="translate(154, 180)" opacity="0.22">
        <path d="M 0,-60 L 52,18 L -52,18 Z M -46,0 H 46 V 68 H -46 Z" fill="#68B8DC" fill-rule="evenodd" stroke="#68B8DC" stroke-width="1.5" stroke-dasharray="4 3"/>
      </g>

      <!-- SNAP PIECE 1: Khối Vuông chân đế (Đã Snap) -->
      <!-- SNAP PIECE 2: Khối Tam Giác lồng vào (Đã Snap) -> Giao thoa 2 lớp rỗng! -->
      <g transform="translate(154, 180)" filter="url(#amberGlow)">
        <path d="M 0,-60 L 52,18 L -52,18 Z 
                 M -46,0 H 46 V 68 H -46 Z" 
              fill="url(#amberGold)" fill-rule="evenodd" stroke="#FFF3C4" stroke-width="1.2"/>
      </g>

      <!-- TEMPORARY PIECE (Mảnh tạm thả ngoài neo - viền đứt) -->
      <g transform="translate(236, 75)" opacity="0.5">
        <polygon points="0,-22 22,0 0,22 -22,0" fill="#FFC857" fill-opacity="0.2" stroke="#FFC857" stroke-width="1.5" stroke-dasharray="4 4"/>
      </g>

      <!-- Label nhãn mảnh tạm -->
      <g transform="translate(154, 342)">
        <rect x="-95" y="-12" width="190" height="20" rx="5" fill="#14263D" opacity="0.85" stroke="#31557A" stroke-width="0.8"/>
        <text y="2" text-anchor="middle" fill="#EEF4FA" font-family="'Segoe UI', Roboto, sans-serif" font-size="9.5">Chưa đặt — chưa tính vào hình</text>
      </g>
    </g>

    <!-- KHAY MẢNH (TRAY) Ở ĐÁY -->
    <g transform="translate(16, 476)">
      <rect width="308" height="60" rx="12" fill="url(#boardGrad)" stroke="#1F3A5F" stroke-width="1.2"/>
      <text x="14" y="16" fill="#7E9BB8" font-family="'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" letter-spacing="1">KHAY MẢNH KÍNH</text>
      <!-- Piece in tray: Spare diamond or triangle -->
      <g transform="translate(70, 36)" filter="url(#amberGlow)">
        <rect x="-14" y="-14" width="28" height="28" fill="url(#amberGold)" stroke="#FFF3C4" stroke-width="0.8"/>
      </g>
      <g transform="translate(154, 36)" filter="url(#amberGlow)">
        <polygon points="0,-16 16,14 -16,14" fill="url(#amberGold)" stroke="#FFF3C4" stroke-width="0.8"/>
      </g>
      <g transform="translate(238, 36)" filter="url(#amberGlow)">
        <polygon points="0,-14 14,0 0,14 -14,0" fill="url(#amberGold)" stroke="#FFF3C4" stroke-width="0.8"/>
      </g>
    </g>

    <!-- NÚT ĐIỀU KHIỂN DƯỚI CÙNG -->
    <g transform="translate(16, 546)">
      <!-- Menu Button -->
      <rect x="0" y="0" width="94" height="34" rx="8" fill="#12233B" stroke="#68B8DC" stroke-width="1"/>
      <text x="47" y="21" text-anchor="middle" fill="#EEF4FA" font-family="'Segoe UI', Roboto, sans-serif" font-size="12">Menu</text>

      <!-- Reset Button -->
      <rect x="107" y="0" width="94" height="34" rx="8" fill="#12233B" stroke="#68B8DC" stroke-width="1"/>
      <text x="154" y="21" text-anchor="middle" fill="#EEF4FA" font-family="'Segoe UI', Roboto, sans-serif" font-size="12">Đặt lại</text>

      <!-- Rotate Button (Active in Ch.3 or selected) -->
      <rect x="214" y="0" width="94" height="34" rx="8" fill="#193354" stroke="#FFC857" stroke-width="1"/>
      <text x="261" y="21" text-anchor="middle" fill="#FFC857" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Xoay ↻</text>
    </g>
  </g>

  <!-- RIGHT PANEL: GIẢI THÍCH HỆ LƯỚI & QUY TẮC HIỂN THỊ (EXPLANATION PANEL) -->
  <g transform="translate(450, 70)">
    <rect width="500" height="610" rx="16" fill="url(#boardGrad)" stroke="#223C63" stroke-width="1.2"/>

    <!-- Panel Title -->
    <text x="30" y="40" fill="#EEF4FA" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">HỆ THỐNG LƯỚI VÀ PHẢN HỒI THỊ GIÁC</text>
    <text x="30" y="60" fill="#68B8DC" font-family="'Segoe UI', Roboto, sans-serif" font-size="12">Học tập ngôn ngữ thiết kế từ minigame Tấm Bia Tiên Tri (Honkai: Star Rail)</text>

    <!-- Item 1: Lưới toạ độ vàng ấm (Amber Grid) -->
    <g transform="translate(30, 85)">
      <rect width="440" height="78" rx="10" fill="#0B1426" stroke="#FFC857" stroke-width="0.8" stroke-opacity="0.4"/>
      <!-- Grid visual swatch -->
      <rect x="14" y="14" width="50" height="50" rx="6" fill="#080E24"/>
      <rect x="14" y="14" width="50" height="50" rx="6" fill="url(#hsrGrid)"/>
      <text x="78" y="32" fill="#FFC857" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">1. Lưới Toạ Độ Vàng Hổ Phách (Amber Grid)</text>
      <text x="78" y="52" fill="#A8BFD9" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5">Các đường lưới mảnh màu vàng cam với chấm giao điểm tinh xảo.</text>
      <text x="78" y="67" fill="#68B8DC" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Giúp người chơi dễ dàng căn chỉnh và nhận biết bán kính hút neo (Snap 6 ô).</text>
    </g>

    <!-- Item 2: Vòng tròn ma trận thiên văn (Celestial Dial) -->
    <g transform="translate(30, 175)">
      <rect width="440" height="78" rx="10" fill="#0B1426" stroke="#294870" stroke-width="1"/>
      <!-- Dial visual swatch -->
      <rect x="14" y="14" width="50" height="50" rx="6" fill="#080E24"/>
      <circle cx="39" cy="39" r="20" fill="none" stroke="#68B8DC" stroke-width="1"/>
      <circle cx="39" cy="39" r="16" fill="none" stroke="#FFC857" stroke-width="0.8" stroke-dasharray="3 3"/>
      <circle cx="39" cy="19" r="2" fill="#68B8DC"/>
      <text x="78" y="32" fill="#EEF4FA" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">2. Vòng Tròn Ma Trận Chiêm Tinh (Celestial Dial)</text>
      <text x="78" y="52" fill="#A8BFD9" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5">Viền dạ quang xanh cyan kết hợp các ký tự thiên văn bao bọc bàn chơi.</text>
      <text x="78" y="67" fill="#68B8DC" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Tạo chiều sâu thần thoại, tôn vinh tính thiêng của các cổ ngữ.</text>
    </g>

    <!-- Item 3: Ba trạng thái Parity chồng mảnh (Overlap Behavior) -->
    <g transform="translate(30, 265)">
      <text x="0" y="20" fill="#EEF4FA" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">3. Quy Tắc Giao Thoa Trên Từng Ô Lưới (Parity Rule)</text>

      <!-- State 1 -->
      <g transform="translate(0, 32)">
        <rect width="138" height="110" rx="8" fill="#0B1426" stroke="#1F3A5F"/>
        <rect width="138" height="110" rx="8" fill="url(#hsrGrid)" opacity="0.5"/>
        <rect x="49" y="18" width="40" height="40" fill="url(#amberGold)" stroke="#FFF3C4" stroke-width="1"/>
        <text x="69" y="80" text-anchor="middle" fill="#EEF4FA" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">1 Mảnh</text>
        <text x="69" y="96" text-anchor="middle" fill="#FFC857" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5">Hiện Màu Vàng</text>
      </g>

      <!-- State 2 -->
      <g transform="translate(150, 32)">
        <rect width="138" height="110" rx="8" fill="#0B1426" stroke="#1F3A5F"/>
        <rect width="138" height="110" rx="8" fill="url(#hsrGrid)" opacity="0.5"/>
        <!-- 2 overlapping boxes create hollow center -->
        <path d="M 39,18 H 79 V 58 H 39 Z M 59,18 H 99 V 58 H 59 Z" fill="url(#amberGold)" fill-rule="evenodd" stroke="#FFF3C4" stroke-width="1"/>
        <text x="69" y="80" text-anchor="middle" fill="#EEF4FA" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">2 Mảnh (Giao)</text>
        <text x="69" y="96" text-anchor="middle" fill="#68B8DC" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5">Vùng Giao Rỗng</text>
      </g>

      <!-- State 3 -->
      <g transform="translate(300, 32)">
        <rect width="140" height="110" rx="8" fill="#0B1426" stroke="#1F3A5F"/>
        <rect width="140" height="110" rx="8" fill="url(#hsrGrid)" opacity="0.5"/>
        <!-- 3 overlapping boxes: center reappears! -->
        <path d="M 29,18 H 69 V 58 H 29 Z M 49,18 H 89 V 58 H 49 Z M 69,18 H 109 V 58 H 69 Z" fill="url(#amberGold)" fill-rule="evenodd" stroke="#FFF3C4" stroke-width="1"/>
        <text x="70" y="80" text-anchor="middle" fill="#EEF4FA" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">3 Mảnh (Giao)</text>
        <text x="70" y="96" text-anchor="middle" fill="#FFC857" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5">Tâm Sáng Hiện Lại</text>
      </g>
    </g>

    <!-- Item 4: Trạng thái Mảnh & Phản hồi tương tác -->
    <g transform="translate(30, 430)">
      <rect width="440" height="145" rx="10" fill="#0B1426" stroke="#223C63" stroke-width="0.8"/>
      <text x="18" y="24" fill="#EEF4FA" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Trạng Thái Tương Tác Của Mảnh Kính:</text>
      
      <circle cx="28" cy="46" r="4" fill="#FFC857"/>
      <text x="40" y="50" fill="#EEF4FA" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5"><tspan font-weight="700" fill="#FFC857">Mảnh đã Snap:</tspan> Nằm cố định tại neo, viền sáng liền mạch, tính vào kết quả.</text>

      <circle cx="28" cy="74" r="4" fill="#9DAFC7"/>
      <text x="40" y="78" fill="#EEF4FA" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5"><tspan font-weight="700" fill="#9DAFC7">Mảnh tạm (Chưa Snap):</tspan> Viền đứt nét, độ mờ 50%, KHÔNG tính vào mặt nạ.</text>

      <circle cx="28" cy="102" r="4" fill="#68B8DC"/>
      <text x="40" y="106" fill="#EEF4FA" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5"><tspan font-weight="700" fill="#68B8DC">Bóng mờ mục tiêu (Ghost):</tspan> Hiển thị mờ 20% trên nền lưới để người chơi so sánh.</text>

      <circle cx="28" cy="128" r="4" fill="#E59B28"/>
      <text x="40" y="132" fill="#EEF4FA" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5"><tspan font-weight="700" fill="#E59B28">Xoay ↻ 90°:</tspan> Chỉ xuất hiện từ Chương 3, xoay quanh tâm khung vuông cục bộ.</text>
    </g>
  </g>
</svg>
