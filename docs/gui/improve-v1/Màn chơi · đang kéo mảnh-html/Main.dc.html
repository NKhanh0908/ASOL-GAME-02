body{margin:0}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}

@keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.7);opacity:0}}

.tw{animation:tw 3.2s ease-in-out infinite}

.breathe{animation:breathe 2.4s ease-in-out infinite}
.bob{animation:bob 2.2s ease-in-out infinite}
.sweep{animation:sweep 6s linear infinite}
.rays{animation:rays 40s linear infinite;transform-box:fill-box;transform-origin:center}
button{font:inherit;cursor:pointer}
</style>
