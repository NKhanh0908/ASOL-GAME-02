body{margin:0}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}

@keyframes sweep{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-1600}}

.tw{animation:tw 3.2s ease-in-out infinite}
.spin{animation:spin 120s linear infinite;transform-box:fill-box;transform-origin:center}

.bob{animation:bob 2.2s ease-in-out infinite}
.sweep{animation:sweep 6s linear infinite}
.rays{animation:rays 40s linear infinite;transform-box:fill-box;transform-origin:center}
button{font:inherit;cursor:pointer}
</style>
